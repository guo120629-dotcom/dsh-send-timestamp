# dsh-send-timestamp 组合层：把 Host 插件行插入当前组合。
# 插件行按包名引用，由 Node 模块解析在 profile 的 node_modules 中找到本包。
# 这一行的 id 同时就是设置命名空间：client 端 ctx.configForms.get('send-timestamp')。
- insert:
    - id: send-timestamp
      name: '@local/dsh-send-timestamp'
      config: { enabled: false, preset: 'monthday', sessions: {} }
